# Default LLM Gateway Routing Policy (Plan 1 Section 5.1)
version: 1
profile: default
budgets:
  ttft_ms: 450
  total_turn_ms: 1000
  cost_weight: 0.3

tiers:
  t0_fast_path:
    enabled: true
    deterministic: true
  t1_local:
    backend: ollama_local
    model: qwen3:1.7b
    ttft_budget_ms: 300
  t2_large:
    backend: local_vllm
    model: qwen2.5-7b-instruct
    ttft_budget_ms: 600
  t3_safe_mode:
    deterministic: true

rules:
  - id: r_high_risk
    when:
      risk_tier: high
    route: t1_local
    constraint: strict_schema
  - id: r_default
    when: {}
    route: t1_local
