# Default LLM Gateway Routing Policy (Plan 1 Section 5.1)
version: 1
profile: default
budgets:
  ttft_ms: 450
  total_turn_ms: 1000
  cost_weight: 0.3          # 0 = latency only, 1 = cost only

tiers:
  t0_fast_path:
    kind: deterministic
    enabled: true
  t1_local:
    backend: ollama_local
    model: "qwen3:1.7b"
    enabled: true
  t2_large:
    backend: remote_large
    model: "qwen2.5-7b-instruct"
    enabled: false
  t3_safe_mode:
    kind: deterministic
    enabled: true

rules:
  - id: r_high_risk
    when:
      risk_tier: high
    use: t1_local
    constrain: strict
    fallback: [t3_safe_mode]

  - id: r_hard_turn
    when:
      dialogue_state: negotiation
      utterance_tokens_gt: 25
    use: t2_large
    fallback: [t1_local, t3_safe_mode]

  - id: r_default
    default: true
    use: t1_local
    fallback: [t3_safe_mode]

circuit_breaker:
  failures: 3
  window_s: 30
  cooldown_s: 20

constraints:
  output_schema: brain_turn_v1
  token_masks:
    unverified_identity: [ascii_digits, fullwidth_digits, currency_symbols]
  on_unsupported_backend: validate_and_retry_once

cache:
  prefix:
    enabled: true
  response:
    enabled: false
    cacheable_intents: []
    ttl_s: 3600
    semantic_matching: false

pricing_ref: config/pricing.yaml
