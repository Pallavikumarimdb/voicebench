apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-deployment
  namespace: voiceai
  labels:
    app: voice-stt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-stt
  template:
    metadata:
      labels:
        app: voice-stt
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stt
          image: voiceai/stt:latest
          ports:
            - containerPort: 8001
          env:
            - name: STT_ENGINE
              value: "sherpa-onnx"
            - name: SHERPA_MODEL
              value: "sense-voice"
            - name: STT_DEVICE
              value: "cpu"
            - name: STT_COMPUTE_TYPE
              value: "int8"
            - name: LOCAL_AGREEMENT_N
              value: "2"
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stt-service
  namespace: voiceai
spec:
  selector:
    app: voice-stt
  ports:
    - port: 8001
      targetPort: 8001
