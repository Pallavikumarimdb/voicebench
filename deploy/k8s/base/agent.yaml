apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-deployment
  namespace: voiceai
  labels:
    app: voice-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-agent
  template:
    metadata:
      labels:
        app: voice-agent
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: agent
          image: voiceai/agent:latest
          ports:
            - containerPort: 8003
          env:
            - name: LLM_GATEWAY_URL
              value: "http://llm-gateway-service:8005"
            - name: AGENT_PORT
              value: "8003"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: voiceai
spec:
  selector:
    app: voice-agent
  ports:
    - port: 8003
      targetPort: 8003
