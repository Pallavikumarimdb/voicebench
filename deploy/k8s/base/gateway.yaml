apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: voiceai
  labels:
    app: voice-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voice-gateway
  template:
    metadata:
      labels:
        app: voice-gateway
    spec:
      # Plan 1 P6-T3: terminationGracePeriodSeconds set to max call length (e.g. 15m = 900s)
      # to guarantee live calls are never terminated abruptly on scale-in
      terminationGracePeriodSeconds: 900
      containers:
        - name: gateway
          image: voiceai/gateway:latest
          ports:
            - containerPort: 8443
          envFrom:
            - configMapRef:
                name: voiceai-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Triggers graceful drain: marks readiness false, drains live WebSocket sessions
                command: ["/bin/sh", "-c", "curl -X POST http://localhost:8443/drain || sleep 1"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: voiceai
spec:
  selector:
    app: voice-gateway
  # Ingress session affinity at connection time
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - port: 8443
      targetPort: 8443
